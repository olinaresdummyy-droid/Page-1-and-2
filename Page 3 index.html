    <div class="box">
        <header>
            <h1 class="thin-heading">Customer Service</h1>
            <p>Have questions about your auditions or account? Our team is here to help you shine. Fill out the form below and we will get back to you within 24 hours.</p>
        </header>

        <form class="contact-form">
            <div class="input-group">
                <label>Full Name</label>
                <input type="text" placeholder="Enter your name" required>
            </div>
            <div class="input-group">
                <label>Email Address</label>
                <input type="email" placeholder="email@example.com" required>
            </div>
            <div class="input-group">
                <label>Message</label>
                <textarea rows="5" placeholder="How can we help you today?" required></textarea>
            </div>
            <button type="submit" class="submit-btn">SEND MESSAGE</button>
        </form>
    </div>
