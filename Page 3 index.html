<body>

    <nav>
        <a href="index.html"><img src="Images/Logo-removebg-preview.png" class="nav-logo" alt="Dream Star Logo"></a>
        <div class="nav-links">

    </nav>

    <div class="container">
        <div class="main-content-box" style="margin-top: 40px;">
            <h2 style="margin-top: 0;">CUSTOMER SERVICE</h2>
            <p style="color: #666; margin-bottom: 30px;">Have questions? Our team is here to help you shine. Fill out the form below and we will get back to you within 24 hours.</p>
            
            <form action="#">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" placeholder="Enter your name" required>
                </div>

                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" placeholder="email@example.com" required>
                </div>

                <div class="form-group">
                    <label>Message</label>
                    <textarea rows="5" placeholder="How can we help you today?" style="width: 100%; border-radius: 18px; border: 1px solid #e0e0e0; padding: 16px; font-family: inherit; box-sizing: border-box;"></textarea>
                </div>

                <button type="submit" class="submit-btn">SEND MESSAGE</button>
            </form>
        </div>
    </div>
