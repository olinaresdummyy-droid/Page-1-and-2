    <div class="container">
        <div class="left-logo">
            <img src="c:\Users\oprin\OneDrive\Page\Pictures\Logo-removebg-preview.png" alt="Dream Star Logo">
        </div>

        <div class="right-section">
            <h1>APPLICATION</h1>

            <form id="applicationForm">
                <div class="form-grid">
                    <div class="input-group">
                        <label>Name:</label>
                        <input type="text" required>
                        <label>Age:</label>
                        <input type="number" required>
                        <label>Contact Number:</label>
                        <input type="text" required>
                        <label>Address:</label>
                        <input type="text" required>
                        <label>Email:</label>
                        <input type="email" required>
                    </div>

                    <div class="input-group">
                        <label>Talents:</label>
                        <input type="text" required>
                        <label>Applying for:</label>
                        <select required>
                            <option value="">Select</option>
                            <option>Ensemble/Cast Member</option>
                            <option>Dancer</option>
                            <option>Singer/Vocalist</option>
                            <option>Actor/Actress</option>
                            <option>Swing/Understudy</option>
                            <option>Stage Crew</option>
                            <option>Choreographer</option>
                            <option>Light Crew</option>
                        </select>
                    </div>
                </div>

                <h3>Attach a file here</h3>
                <div class="file-box">
                    <input type="file">
                    <p>Picture of your Passport, National ID, or Driver’s License</p>
                </div>

                <button type="submit">Submit</button>
            </form>

            <div class="cta-banner">BE BOLD. BE CREATIVE. BE A DREAMER.</div>
        </div>
    </div>

        document.getElementById('applicationForm').addEventListener('submit', function(e) {
            e.preventDefault(); 
            alert("Application submitted successfully!");
            this.reset(); 
        });
    </script>
