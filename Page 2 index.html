<body>

<nav>
        <a href="index.html"><img src="Images/Logo-removebg-preview.png" class="nav-logo" alt="Dream Star Logo"></a>
        <div class="nav-links">
            <a href="index.html" class="nav-btn">ABOUT US</a>

            <a href="Page 3 index.html" class="nav-btn">CUSTOMER SERVICE</a>

    <div class="container">
        <div class="main-content-box" style="margin-top: 40px;">
            <h2 style="margin-top: 0; margin-bottom: 30px;">APPLICATION</h2>
            
            <form action="#">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" placeholder="Enter your full name" required>
                </div>

                <div class="form-group">
                    <label>Age</label>
                    <input type="number" placeholder="How old are you?" required>
                </div>

                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" placeholder="example@email.com" required>
                </div>

                <div class="form-group">
                    <label>Submit your Picture or ID</label>
                    <div class="upload-area">
                        <input type="file" accept="image/*" required>
                        <p style="font-size: 12px; color: #666; margin-top: 10px;">JPG or PNG only</p>
                    </div>
                </div>

                <button type="submit" class="submit-btn">SUBMIT APPLICATION</button>
            </form>
        </div>
    </div>
