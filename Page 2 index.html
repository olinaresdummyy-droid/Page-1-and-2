<!DOCTYPE html>
<html>
<head>
 <meta charset="UTF-8">
    <title>Be A Dreamer - Application</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #e8dcd1;
            margin: 0;
        }
nav {
    background: #e8dcd1;
    border-top: 2px solid black;
    border-bottom: 2px solid black;
    border-radius: 15px 15px 0 0;
    text-align: center;
    padding: 15px 0;
}

nav a {
    margin: 0 50px;
    text-decoration: none;
    color: black;
    font-weight: bold;
    font-size: 16px;
    letter-spacing: 1px;
}

nav a:hover {
    color: #555;
}

        .container {
            width: 85%;
            margin: auto;
            padding: 20px;
            display: flex;
            gap: 50px;
        }

        .left-logo {
            width: 280px;
            text-align: center;
        }

        .left-logo img {
            width: 200px;
        }

        h1 {
            text-align: center;
            letter-spacing: 3px;
        }

        label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
        }

        input, select {
            width: 300px;
            padding: 8px;
            border-radius: 10px;
            border: 1px solid #888;
            margin-bottom: 10px;
        }

        .row {
            display: flex;
            gap: 40px;
        }

        .file-box {
            width: 350px;
            height: 200px;
            border: 3px solid black;
            border-radius: 25px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 20px;
            background: white;
        }

        button {
            margin-top: 30px;
            padding: 12px 25px;
            font-size: 16px;
            border: 2px solid black;
            background: #f3eddb;
            cursor: pointer;
        }

        footer {
            text-align: center;
            margin-top: 40px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .right-section {
            flex: 1;
        }
    </style>
</head>

<body>

    <nav>
        <a href="index.html">ABOUT US</a>
        <a href="Page 2 index.html">APPLICATION</a>
        <a href="#">CUSTOMER SERVICE</a>
    </nav>

    <div class="container">

        <div class="left-logo">
            <img src="c:\Users\oprin\OneDrive\Pictures\Screenshots\Logo.png">
        </div>

        <div class="right-section">
            <h1>APPLICATION</h1>

            <form id="applicationForm">
                <div class="row">
                    <div>
                        <label>Name:</label>
                        <input type="text" required>

                        <label>Age:</label>
                        <input type="number" required>

                        <label>Contact Number:</label>
                        <input type="text" required>

                        <label>Address:</label>
                        <input type="text" required>

                        <label>Email:</label>
                        <input type="email" required>
                    </div>

                    <div>
                        <label>Talents:</label>
                        <input type="text" required>

                        <label>Applying for:</label>
                        <select required>
                            <option value="">Select</option>
                            <option>Ensemble/Cast Member</option>
                            <option>Dancer</option>
                            <option>Singer/Vocalist</option>
                            <option>Actor/Actress</option>
                            <option>Swing/Understudy</option>
                            <option>Stage Crew</option>
                            <option>Choreographer</option>
                            <option>Light Crew</option>
                        </select>
                    </div>
                </div>

                <h3>Attach a file here</h3>

                <div class="file-box">
                    <input type="file">
                </div>

                <p>Picture of your Passport, National ID, or Driver’s License</p>

                <button type="submit">Submit</button>
            </form>

            <footer>
                BE BOLD. BE CREATIVE. BE A DREAMER.
            </footer>
        </div>

    </div>

    <script>
    
        document.getElementById('applicationForm').addEventListener('submit', function(e) {
            e.preventDefault(); 
            alert("Application submitted successfully!");
            this.reset(); 
        });
    </script>

</body>
</html>
